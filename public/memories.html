<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chuchi · Memories</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0a0f;
  --surface: #13131a;
  --surface2: #1c1c26;
  --border: rgba(255,255,255,0.07);
  --accent: #c8a96e;
  --accent2: #7c6ef0;
  --text: #e8e6e0;
  --muted: #6b6980;
  --success: #4caf7d;
  --danger: #e05c5c;
  --warn: #e0a04a;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  font-weight: 300;
  min-height: 100vh;
}
body::before {
  content:'';
  position:fixed; top:-200px; left:-200px;
  width:700px; height:700px;
  background: radial-gradient(circle, rgba(124,110,240,0.05) 0%, transparent 70%);
  pointer-events:none; z-index:0;
}
body::after {
  content:'';
  position:fixed; bottom:-300px; right:-200px;
  width:600px; height:600px;
  background: radial-gradient(circle, rgba(200,169,110,0.04) 0%, transparent 70%);
  pointer-events:none; z-index:0;
}

/* HEADER */
.header {
  display:flex; align-items:center; justify-content:space-between;
  padding:16px 28px;
  border-bottom:1px solid var(--border);
  background:rgba(10,10,15,0.95);
  backdrop-filter:blur(12px);
  position:sticky; top:0; z-index:10;
}
.brand { display:flex; align-items:center; gap:14px; }
.orb {
  width:44px; height:44px; border-radius:50%;
  background: radial-gradient(circle at 50% 35%, #f5e6c4 0%, #c8a96e 55%, #7a5d2e 100%);
  position:relative; overflow:hidden;
  border:1.5px solid var(--accent);
  box-shadow: 0 0 0 1px rgba(200,169,110,0.3), 0 0 16px rgba(200,169,110,0.35);
}
.orb img {
  width:100%; height:100%;
  object-fit:contain; object-position:center bottom;
  mix-blend-mode:multiply; filter:contrast(1.05);
}
.name { font-family:'DM Serif Display',serif; font-size:22px; color:var(--text); line-height:1; }
.name span { color:var(--accent); }
.sub { font-size:11px; color:var(--muted); letter-spacing:0.14em; text-transform:uppercase; margin-top:4px; }
.back {
  font-size:13px; color:var(--muted); text-decoration:none;
  padding:7px 13px; border-radius:7px; border:1px solid var(--border);
  transition:all 0.15s;
}
.back:hover { color:var(--text); border-color:var(--accent); }

/* CONTAINER */
.container {
  max-width:1080px; margin:0 auto; padding:28px;
  position:relative; z-index:1;
}

/* PAGE TITLE */
.page-title {
  font-family:'DM Serif Display',serif; font-size:30px;
  margin-bottom:6px; letter-spacing:-0.01em;
}
.page-title-em { font-style:italic; color:var(--accent); }
.page-sub { color:var(--muted); font-size:14px; margin-bottom:28px; }

/* PENDING SECTION */
.pending-section {
  margin-bottom:32px;
}
.section-label {
  font-size:11px; color:var(--muted); letter-spacing:0.14em;
  text-transform:uppercase; margin-bottom:12px;
  display:flex; align-items:center; gap:8px;
}
.section-label .count {
  background: rgba(200,169,110,0.15); color:var(--accent);
  border:1px solid rgba(200,169,110,0.3);
  padding:1px 8px; border-radius:20px; font-size:11px;
}
.pending-card {
  background: linear-gradient(135deg, rgba(200,169,110,0.08), rgba(124,110,240,0.05));
  border: 1px solid rgba(200,169,110,0.25);
  border-left: 3px solid var(--accent);
  border-radius: 10px;
  padding: 14px 16px;
  margin-bottom: 10px;
  display: flex; gap: 12px; align-items: flex-start;
}
.pending-content { flex:1; }
.pending-text { color:var(--text); font-size:14px; line-height:1.55; margin-bottom:4px; }
.pending-meta { font-size:11px; color:var(--muted); display:flex; gap:10px; flex-wrap:wrap; }
.pending-meta .reason { font-style:italic; }
.pending-actions { display:flex; gap:6px; flex-shrink:0; }
.btn-confirm, .btn-reject {
  width:32px; height:32px; border-radius:7px;
  background:transparent; border:1px solid var(--border);
  cursor:pointer; color:var(--muted);
  font-size:14px; transition:all 0.15s;
  display:flex; align-items:center; justify-content:center;
}
.btn-confirm:hover { background:rgba(76,175,125,0.15); border-color:var(--success); color:var(--success); }
.btn-reject:hover { background:rgba(224,92,92,0.15); border-color:var(--danger); color:var(--danger); }

/* SEARCH + TABS */
.toolbar {
  display:flex; gap:10px; align-items:center; margin-bottom:18px;
  flex-wrap:wrap;
}
.search-box {
  flex:1; min-width:240px; position:relative;
}
.search-box input {
  width:100%; padding:11px 14px 11px 38px;
  background:var(--surface); border:1px solid var(--border);
  border-radius:9px; color:var(--text); font-family:inherit;
  font-size:13.5px; outline:none; transition:border-color 0.15s;
}
.search-box input:focus { border-color:rgba(200,169,110,0.4); }
.search-box::before {
  content:'🔍'; position:absolute; left:12px; top:50%;
  transform:translateY(-50%); font-size:13px; opacity:0.5;
  pointer-events:none;
}

/* VIEW TOGGLE */
.view-toggle {
  display:flex; gap:2px; background:var(--surface);
  border:1px solid var(--border); border-radius:9px; padding:3px;
}
.view-btn {
  padding:7px 13px; background:transparent; border:none;
  color:var(--muted); font-size:12px; cursor:pointer;
  border-radius:6px; transition:all 0.15s; font-family:inherit;
}
.view-btn.active { background:var(--surface2); color:var(--text); }
.view-btn:hover:not(.active) { color:var(--text); }

/* TABS */
.tabs {
  display:flex; gap:4px; margin-bottom:20px; flex-wrap:wrap;
  border-bottom:1px solid var(--border); padding-bottom:1px;
}
.tab {
  padding:9px 16px; cursor:pointer; font-size:13px;
  color:var(--muted); border:none; background:transparent;
  font-family:inherit; transition:all 0.15s;
  border-bottom:2px solid transparent; margin-bottom:-1px;
}
.tab:hover { color:var(--text); }
.tab.active { color:var(--accent); border-bottom-color:var(--accent); }
.tab .badge {
  display:inline-block; margin-left:6px;
  background:var(--surface2); color:var(--muted);
  padding:1px 7px; border-radius:20px; font-size:10px;
}
.tab.active .badge { background:rgba(200,169,110,0.2); color:var(--accent); }

/* MEMORY GRID */
.memory-grid {
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
  gap:12px;
}
.memory-card {
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:10px;
  padding:14px 16px;
  transition:all 0.15s;
  position:relative;
  display:flex; flex-direction:column;
}
.memory-card:hover {
  border-color:rgba(200,169,110,0.25);
  transform:translateY(-1px);
}
.memory-card.pinned {
  border-left:3px solid var(--accent);
  background:linear-gradient(135deg, rgba(200,169,110,0.04), var(--surface));
}
.memory-header {
  display:flex; align-items:center; justify-content:space-between;
  margin-bottom:8px; gap:8px;
}
.cat-badge {
  font-size:10px; letter-spacing:0.08em; text-transform:uppercase;
  padding:2px 9px; border-radius:20px; font-weight:500;
}
.cat-person { background:rgba(124,110,240,0.15); color:var(--accent2); border:1px solid rgba(124,110,240,0.3); }
.cat-business { background:rgba(200,169,110,0.15); color:var(--accent); border:1px solid rgba(200,169,110,0.3); }
.cat-preference { background:rgba(76,175,125,0.15); color:var(--success); border:1px solid rgba(76,175,125,0.3); }
.cat-decision { background:rgba(224,160,74,0.15); color:var(--warn); border:1px solid rgba(224,160,74,0.3); }
.cat-other { background:var(--surface2); color:var(--muted); border:1px solid var(--border); }
.pin-icon { font-size:13px; color:var(--accent); }

.memory-content {
  color:var(--text); font-size:14px; line-height:1.6;
  margin-bottom:8px; flex:1;
}
.memory-content[contenteditable="true"] {
  outline:1px solid var(--accent); padding:6px 8px;
  border-radius:5px; background:var(--bg);
}
.memory-context {
  font-size:12px; color:var(--muted); font-style:italic;
  padding-top:8px; border-top:1px dashed var(--border);
}
.memory-footer {
  display:flex; align-items:center; justify-content:space-between;
  margin-top:10px; padding-top:10px; border-top:1px solid var(--border);
}
.memory-date { font-size:11px; color:var(--muted); }
.memory-actions { display:flex; gap:4px; }
.icon-btn {
  width:26px; height:26px; border-radius:5px;
  background:transparent; border:1px solid transparent;
  cursor:pointer; color:var(--muted); font-size:13px;
  transition:all 0.15s;
  display:flex; align-items:center; justify-content:center;
}
.icon-btn:hover { background:var(--surface2); color:var(--text); border-color:var(--border); }
.icon-btn.pin-active { color:var(--accent); }
.icon-btn.danger:hover { color:var(--danger); border-color:rgba(224,92,92,0.3); }

/* EMPTY STATE */
.empty {
  padding:60px 20px; text-align:center; color:var(--muted);
  background:var(--surface); border:1px dashed var(--border);
  border-radius:12px;
}
.empty-icon { font-size:38px; margin-bottom:14px; opacity:0.5; }
.empty-title { font-family:'DM Serif Display',serif; font-size:18px; margin-bottom:6px; color:var(--text); }
.empty-text { font-size:13px; max-width:400px; margin:0 auto; line-height:1.6; }

/* LOADING */
.loading {
  padding:60px 20px; text-align:center; color:var(--muted);
  font-size:13px;
}
.spinner {
  width:24px; height:24px; border:2px solid var(--border);
  border-top-color:var(--accent); border-radius:50%;
  animation:spin 0.8s linear infinite; margin:0 auto 14px;
}
@keyframes spin { to { transform:rotate(360deg); } }

/* TOAST */
.toast-stack {
  position:fixed; bottom:24px; right:24px; z-index:100;
  display:flex; flex-direction:column; gap:8px;
}
.toast {
  background:var(--surface2); border:1px solid var(--border);
  border-left:3px solid var(--accent);
  border-radius:7px; padding:11px 16px;
  color:var(--text); font-size:13px;
  box-shadow:0 6px 22px rgba(0,0,0,0.3);
  animation:slideIn 0.25s ease;
  max-width:320px;
}
.toast.success { border-left-color:var(--success); }
.toast.error { border-left-color:var(--danger); }
@keyframes slideIn { from{opacity:0;transform:translateX(20px)} to{opacity:1;transform:translateX(0)} }

/* ADD MEMORY BUTTON */
.add-memory {
  background:linear-gradient(135deg, rgba(200,169,110,0.15), rgba(124,110,240,0.1));
  border:1px solid rgba(200,169,110,0.3);
  color:var(--accent); padding:11px 16px; border-radius:9px;
  font-size:13px; cursor:pointer; font-family:inherit;
  transition:all 0.15s;
}
.add-memory:hover { background:rgba(200,169,110,0.2); }

/* MODAL */
.modal-bg {
  position:fixed; inset:0; background:rgba(0,0,0,0.7);
  backdrop-filter:blur(4px); z-index:50;
  display:none; align-items:center; justify-content:center;
  padding:20px;
}
.modal-bg.show { display:flex; }
.modal {
  background:var(--surface); border:1px solid var(--border);
  border-radius:14px; padding:24px; max-width:480px; width:100%;
  animation: modalIn 0.2s ease;
}
@keyframes modalIn { from{opacity:0;transform:scale(0.96)} to{opacity:1;transform:scale(1)} }
.modal h3 { font-family:'DM Serif Display',serif; font-size:20px; margin-bottom:16px; }
.modal label { display:block; font-size:11px; color:var(--muted); letter-spacing:0.1em; text-transform:uppercase; margin-bottom:6px; margin-top:14px; }
.modal label:first-of-type { margin-top:0; }
.modal input, .modal textarea, .modal select {
  width:100%; background:var(--bg); border:1px solid var(--border);
  border-radius:7px; padding:10px 12px; color:var(--text);
  font-family:inherit; font-size:13.5px; outline:none;
}
.modal input:focus, .modal textarea:focus, .modal select:focus { border-color:var(--accent); }
.modal textarea { min-height:80px; resize:vertical; }
.modal-actions { display:flex; gap:8px; justify-content:flex-end; margin-top:20px; }
.btn-secondary, .btn-primary {
  padding:9px 16px; border-radius:7px; font-family:inherit;
  font-size:13px; cursor:pointer; border:1px solid var(--border);
  transition:all 0.15s;
}
.btn-secondary { background:transparent; color:var(--muted); }
.btn-secondary:hover { color:var(--text); border-color:var(--text); }
.btn-primary { background:var(--accent); color:var(--bg); border-color:var(--accent); font-weight:500; }
.btn-primary:hover { opacity:0.85; }

/* SCROLLBAR */
::-webkit-scrollbar { width:5px; height:5px; }
::-webkit-scrollbar-thumb { background:var(--border); border-radius:5px; }
::-webkit-scrollbar-thumb:hover { background:var(--muted); }

@media (max-width:600px) {
  .container { padding:16px; }
  .page-title { font-size:24px; }
  .toolbar { flex-direction:column; align-items:stretch; }
  .view-toggle { width:100%; }
  .view-btn { flex:1; }
}
</style>
</head>
<body>

<div class="header">
  <div class="brand">
    <div class="orb"><img src="/chuchi.png" alt="Chuchi"></div>
    <div>
      <div class="name">Chu<span>chi</span></div>
      <div class="sub">Memory · Second Mind HQ</div>
    </div>
  </div>
  <a href="/" class="back">← Back to chat</a>
</div>

<div class="container">

  <h1 class="page-title">What I <span class="page-title-em">know</span></h1>
  <div class="page-sub">Everything I've learned about you, your business, and the people in your world. Edit anything that's wrong — I'll trust your version.</div>

  <!-- PENDING CONFIRMATIONS -->
  <div id="pendingWrap" style="display:none;">
    <div class="pending-section">
      <div class="section-label">
        Awaiting your confirmation
        <span class="count" id="pendingCount">0</span>
      </div>
      <div id="pendingList"></div>
    </div>
  </div>

  <!-- TOOLBAR -->
  <div class="toolbar">
    <div class="search-box">
      <input type="text" id="search" placeholder="Search memories…">
    </div>
    <button class="add-memory" onclick="openAddModal()">+ Add memory</button>
  </div>

  <!-- TABS -->
  <div class="tabs" id="tabs"></div>

  <!-- CONTENT -->
  <div id="content">
    <div class="loading">
      <div class="spinner"></div>
      Loading what I know…
    </div>
  </div>
</div>

<!-- ADD MODAL -->
<div class="modal-bg" id="addModal">
  <div class="modal">
    <h3>Add a memory</h3>
    <label>Category</label>
    <select id="newCat">
      <option value="business">Business fact</option>
      <option value="person">Person</option>
      <option value="preference">Your preference</option>
      <option value="decision">Decision</option>
      <option value="other">Other</option>
    </select>
    <label>What should I remember?</label>
    <textarea id="newContent" placeholder="e.g. Joel Bauer's event capacity is 60 seats"></textarea>
    <label>Context (optional)</label>
    <input id="newContext" type="text" placeholder="e.g. set during April 2026 launch">
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeAddModal()">Cancel</button>
      <button class="btn-primary" onclick="saveNewMemory()">Save</button>
    </div>
  </div>
</div>

<div class="toast-stack" id="toasts"></div>

<script>
// ══════════════════════════════════════════════════
// STATE
// ══════════════════════════════════════════════════
let state = {
  memories: [],
  pending: [],
  currentTab: 'all',
  searchTerm: '',
};

const CATEGORIES = [
  { id: 'all',         label: 'All' },
  { id: 'pinned',      label: '📌 Pinned' },
  { id: 'recent',      label: 'Recent' },
  { id: 'person',      label: 'People' },
  { id: 'business',    label: 'Business' },
  { id: 'preference',  label: 'Preferences' },
  { id: 'decision',    label: 'Decisions' },
  { id: 'other',       label: 'Other' },
];

// ══════════════════════════════════════════════════
// API
// ══════════════════════════════════════════════════
async function api(action, payload = {}) {
  const method = action === 'list' ? 'GET' : 'POST';
  const body = method === 'POST' ? JSON.stringify({ action, ...payload }) : null;
  const res = await fetch('/api/memory-list', {
    method,
    headers: { 'Content-Type': 'application/json' },
    body,
  });
  return res.json();
}

async function loadAll() {
  try {
    const data = await api('list');
    state.memories = data.memories || [];
    state.pending = data.pending || [];
    render();
  } catch (e) {
    showToast('Could not load memories: ' + e.message, 'error');
  }
}

// ══════════════════════════════════════════════════
// RENDER
// ══════════════════════════════════════════════════
function render() {
  renderPending();
  renderTabs();
  renderMemories();
}

function renderPending() {
  const wrap = document.getElementById('pendingWrap');
  const list = document.getElementById('pendingList');
  const count = document.getElementById('pendingCount');
  if (!state.pending.length) {
    wrap.style.display = 'none';
    return;
  }
  wrap.style.display = 'block';
  count.textContent = state.pending.length;
  list.innerHTML = state.pending.map(p => `
    <div class="pending-card">
      <div class="pending-content">
        <div class="pending-text">${escape(p.content)}</div>
        <div class="pending-meta">
          <span>${escape(p.category)}</span>
          ${p.context ? `<span>· ${escape(p.context)}</span>` : ''}
          ${p.reason ? `<span class="reason">· ${escape(p.reason)}</span>` : ''}
        </div>
      </div>
      <div class="pending-actions">
        <button class="btn-confirm" title="Save this" onclick="confirmPending('${p.id}')">✓</button>
        <button class="btn-reject" title="Discard" onclick="rejectPending('${p.id}')">✕</button>
      </div>
    </div>
  `).join('');
}

function renderTabs() {
  const wrap = document.getElementById('tabs');
  wrap.innerHTML = CATEGORIES.map(c => {
    const count = countForTab(c.id);
    const isActive = state.currentTab === c.id;
    return `
      <button class="tab ${isActive ? 'active' : ''}" onclick="setTab('${c.id}')">
        ${c.label}
        <span class="badge">${count}</span>
      </button>
    `;
  }).join('');
}

function countForTab(tabId) {
  if (tabId === 'all') return state.memories.length;
  if (tabId === 'pinned') return state.memories.filter(m => m.pinned).length;
  if (tabId === 'recent') return Math.min(state.memories.length, 20);
  return state.memories.filter(m => m.category === tabId).length;
}

function setTab(tabId) {
  state.currentTab = tabId;
  render();
}

function filteredMemories() {
  let mems = [...state.memories];

  // Filter by tab
  if (state.currentTab === 'pinned') {
    mems = mems.filter(m => m.pinned);
  } else if (state.currentTab === 'recent') {
    mems = mems.sort((a, b) => new Date(b.created_at) - new Date(a.created_at)).slice(0, 20);
  } else if (state.currentTab !== 'all') {
    mems = mems.filter(m => m.category === state.currentTab);
  }

  // Filter by search
  if (state.searchTerm) {
    const q = state.searchTerm.toLowerCase();
    mems = mems.filter(m =>
      (m.content || '').toLowerCase().includes(q) ||
      (m.context || '').toLowerCase().includes(q)
    );
  }

  // Default sort: pinned first, then recent
  if (state.currentTab !== 'recent') {
    mems.sort((a, b) => {
      if (a.pinned !== b.pinned) return b.pinned - a.pinned;
      return new Date(b.created_at) - new Date(a.created_at);
    });
  }
  return mems;
}

function renderMemories() {
  const content = document.getElementById('content');
  const mems = filteredMemories();
  if (!mems.length) {
    content.innerHTML = `
      <div class="empty">
        <div class="empty-icon">🐈‍⬛</div>
        <div class="empty-title">${state.memories.length === 0 ? "I don't know anything yet" : 'Nothing here'}</div>
        <div class="empty-text">${state.memories.length === 0
          ? "Talk to me in chat and I'll start learning. Tell me about people, prices, events, anything that matters."
          : 'Try a different tab or clear your search.'}</div>
      </div>
    `;
    return;
  }
  content.innerHTML = `
    <div class="memory-grid">
      ${mems.map(m => memoryCard(m)).join('')}
    </div>
  `;
}

function memoryCard(m) {
  const date = m.created_at ? new Date(m.created_at).toLocaleDateString('en-US',{month:'short',day:'numeric'}) : '';
  return `
    <div class="memory-card ${m.pinned ? 'pinned' : ''}" data-id="${m.id}">
      <div class="memory-header">
        <span class="cat-badge cat-${m.category || 'other'}">${m.category || 'other'}</span>
        ${m.pinned ? '<span class="pin-icon" title="Pinned — always in context">📌</span>' : ''}
      </div>
      <div class="memory-content" id="content-${m.id}">${escape(m.content)}</div>
      ${m.context ? `<div class="memory-context">${escape(m.context)}</div>` : ''}
      <div class="memory-footer">
        <span class="memory-date">${date}</span>
        <div class="memory-actions">
          <button class="icon-btn ${m.pinned ? 'pin-active' : ''}" title="${m.pinned ? 'Unpin' : 'Pin to always-in-context'}" onclick="togglePin('${m.id}', ${!m.pinned})">📌</button>
          <button class="icon-btn" title="Edit" onclick="startEdit('${m.id}')">✏️</button>
          <button class="icon-btn danger" title="Delete" onclick="deleteMemory('${m.id}')">🗑️</button>
        </div>
      </div>
    </div>
  `;
}

// ══════════════════════════════════════════════════
// ACTIONS
// ══════════════════════════════════════════════════
async function togglePin(id, pinned) {
  const m = state.memories.find(x => x.id === id);
  if (m) m.pinned = pinned;
  render();
  await api('pin', { id, pinned });
  showToast(pinned ? 'Pinned' : 'Unpinned', 'success');
}

async function deleteMemory(id) {
  if (!confirm('Forget this memory permanently?')) return;
  state.memories = state.memories.filter(m => m.id !== id);
  render();
  await api('delete', { id });
  showToast('Forgotten', 'success');
}

function startEdit(id) {
  const el = document.getElementById('content-' + id);
  if (!el) return;
  el.contentEditable = 'true';
  el.focus();
  // Select all
  const range = document.createRange();
  range.selectNodeContents(el);
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
  const onBlur = async () => {
    el.contentEditable = 'false';
    el.removeEventListener('blur', onBlur);
    const newContent = el.textContent.trim();
    const orig = state.memories.find(m => m.id === id);
    if (!orig) return;
    if (newContent === orig.content) return;
    if (!newContent) {
      el.textContent = orig.content;
      return;
    }
    orig.content = newContent;
    await api('update', { id, content: newContent });
    showToast('Updated', 'success');
  };
  el.addEventListener('blur', onBlur);
  el.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); el.blur(); }
    if (e.key === 'Escape') {
      const orig = state.memories.find(m => m.id === id);
      if (orig) el.textContent = orig.content;
      el.blur();
    }
  });
}

async function confirmPending(id) {
  const p = state.pending.find(x => x.id === id);
  state.pending = state.pending.filter(x => x.id !== id);
  if (p) {
    state.memories.unshift({
      id: 'temp-' + Date.now(),
      category: p.category,
      content: p.content,
      context: p.context,
      pinned: false,
      created_at: new Date().toISOString(),
    });
  }
  render();
  const result = await api('confirm', { id });
  if (result.saved) {
    // Replace temp with real
    const idx = state.memories.findIndex(m => m.id.startsWith('temp-'));
    if (idx >= 0) state.memories[idx] = result.saved;
    render();
  }
  showToast('Saved to memory', 'success');
}

async function rejectPending(id) {
  state.pending = state.pending.filter(x => x.id !== id);
  render();
  await api('reject', { id });
  showToast('Discarded', 'success');
}

// ── Add modal
function openAddModal() {
  document.getElementById('addModal').classList.add('show');
  document.getElementById('newContent').focus();
}
function closeAddModal() {
  document.getElementById('addModal').classList.remove('show');
  document.getElementById('newCat').value = 'business';
  document.getElementById('newContent').value = '';
  document.getElementById('newContext').value = '';
}
async function saveNewMemory() {
  const category = document.getElementById('newCat').value;
  const content = document.getElementById('newContent').value.trim();
  const context = document.getElementById('newContext').value.trim();
  if (!content) { showToast('Tell me what to remember', 'error'); return; }
  closeAddModal();
  // Hit memory-save endpoint
  try {
    const res = await fetch('/api/memory-save', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ category, content, context: context || null }),
    });
    const data = await res.json();
    if (data.saved) {
      state.memories.unshift(data.saved);
      render();
      showToast('Got it. Saved.', 'success');
    } else {
      showToast('Could not save: ' + (data.error || 'unknown'), 'error');
    }
  } catch (e) {
    showToast('Save failed: ' + e.message, 'error');
  }
}

// ══════════════════════════════════════════════════
// HELPERS
// ══════════════════════════════════════════════════
function escape(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function showToast(msg, type = '') {
  const stack = document.getElementById('toasts');
  const t = document.createElement('div');
  t.className = `toast ${type}`;
  t.textContent = msg;
  stack.appendChild(t);
  setTimeout(() => {
    t.style.opacity = '0';
    t.style.transition = 'opacity 0.3s';
    setTimeout(() => t.remove(), 300);
  }, 2800);
}

// Search input
document.getElementById('search').addEventListener('input', e => {
  state.searchTerm = e.target.value;
  renderMemories();
});

// Close modal on background click
document.getElementById('addModal').addEventListener('click', e => {
  if (e.target.id === 'addModal') closeAddModal();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && document.getElementById('addModal').classList.contains('show')) {
    closeAddModal();
  }
});

// Initial load
loadAll();
</script>
</body>
</html>
